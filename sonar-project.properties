# SonarQube Project Configuration for ACEest Fitness & Gym
# Assignment 2 - Code Quality Gate

sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness and Gym
sonar.projectVersion=2.0

# Source files to scan
sonar.sources=.
sonar.language=py

# Exclude folders that should not be scanned
sonar.exclusions=**/venv/**,**/__pycache__/**,**/migrations/**,**/node_modules/**

# Test folder
sonar.tests=tests/
sonar.test.inclusions=tests/**/*.py

# Coverage report generated by pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# Python version
sonar.python.version=3.11
