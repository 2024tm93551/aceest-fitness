apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness
  labels:
    app: aceest-fitness
    version: "2.0"
spec:
  # Run 2 copies of the app (so one is always available during updates)
  replicas: 2

  selector:
    matchLabels:
      app: aceest-fitness

  # Rolling Update Strategy = zero-downtime deployments
  # maxSurge: 1     = allow 1 extra pod during update
  # maxUnavailable: 0 = never take a pod down before a new one is ready
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: aceest-fitness
    spec:
      containers:
      - name: aceest-fitness

        # -------------------------------------------------------
        # IMPORTANT: Replace YOUR_DOCKERHUB_USERNAME with your
        # actual Docker Hub username
        # -------------------------------------------------------
        image: 2024tm93551thivyata/aceest-fitness:latest

        ports:
        - containerPort: 5000

        # Load environment variables from the ConfigMap
        env:
        - name: FLASK_ENV
          valueFrom:
            configMapKeyRef:
              name: aceest-config
              key: FLASK_ENV
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: aceest-config
              key: APP_NAME

        # Resource limits - prevents the container using too much memory/CPU
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"

        # Liveness probe: Kubernetes will restart the container if / fails
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3

        # Readiness probe: pod only receives traffic when /api/metrics returns 200
        readinessProbe:
          httpGet:
            path: /api/metrics
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
