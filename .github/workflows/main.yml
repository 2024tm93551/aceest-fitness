name: ACEest CI/CD Pipeline - Assignment 2

# Trigger: run on every push to main or develop, and on PRs to main
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Lint, Build, Test ──────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app.py --count --exit-zero --max-complexity=10 --max-line-length=127

    - name: Run tests with coverage
      run: |
        pytest tests/ -v --tb=short \
          --cov=app \
          --cov-report=xml:coverage.xml \
          --cov-report=term-missing

    - name: Upload coverage report as artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

  # ── Job 2: Build Docker image and push to Docker Hub ─────────
  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test   # Only runs if Job 1 passed

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/aceest-fitness:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/aceest-fitness:${{ github.sha }}

    - name: Verify pushed image
      run: |
        echo "Docker image pushed successfully!"
        echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/aceest-fitness:latest"
        echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/aceest-fitness:${{ github.sha }}"
